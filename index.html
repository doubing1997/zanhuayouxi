<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>簪花献礼</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Songti SC","STSong","SimSun",serif;color:#3a3330;
  background:radial-gradient(circle at 82% 88%,rgba(200,16,46,.09),transparent 55%),
             radial-gradient(circle at 12% 4%,rgba(212,160,23,.11),transparent 50%),#f4ecdd;
  user-select:none;-webkit-user-select:none;touch-action:none;
  -webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}

/* ===== 开始界面 ===== */
#startScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 50% 40%,#fffdf8,#f0e5d2 80%);
  transition:opacity .5s ease}
#startScreen.hidden{opacity:0;pointer-events:none}

.game-title{
  font-size:48px;font-weight:900;
  background:linear-gradient(to bottom,#ff4d4d,#c8102e 55%,#a80f24 75%,#d4a017);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  letter-spacing:.15em;margin:0 0 14px;text-align:center;line-height:1.2;
  filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 6px 12px rgba(200,16,46,.3));
  animation:titleGlow 2s ease-in-out infinite alternate;
}
@keyframes titleGlow{
  from{filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 6px 12px rgba(200,16,46,.3))}
  to{filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 6px 22px rgba(212,160,23,.55))}
}
.start-subtitle{font-size:13px;letter-spacing:.4em;color:#a0928a;margin:0 0 42px}

#btnStart{
  width:220px;height:220px;
  max-width:62vw;max-height:62vw;
  border:none;background:transparent;cursor:pointer;padding:0;
  animation:float 3s ease-in-out infinite;
  filter:drop-shadow(0 8px 20px rgba(200,16,46,.28));
  touch-action:manipulation;
}
#btnStart img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* ===== 顶部标题 ===== */
#title{position:absolute;top:0;left:0;right:0;height:52px;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#title h1{margin:0;font-size:20px;letter-spacing:.22em;color:#c8102e}
#title p{margin:2px 0 0;font-size:9px;letter-spacing:.34em;color:#a0928a}

/* ===== 舞台 ===== */
.stage-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:50px 4px 160px}
#stage{position:relative;overflow:hidden;border-radius:20px;
  background:radial-gradient(circle at 50% 30%,#fffdf8,#f0e5d2 76%);
  box-shadow:inset 0 0 0 1px rgba(212,160,23,.3),0 10px 30px rgba(58,51,48,.10);
  touch-action:none;contain:layout paint style}

#girlImg{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  height:100%;object-fit:contain;pointer-events:none;z-index:1;
  -webkit-user-drag:none;user-select:none}

#layer{position:absolute;inset:0;z-index:2}
#petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}

.petal{position:absolute;top:0;border-radius:60% 0 60% 60%;
  background:radial-gradient(circle at 35% 65%,#ffeaa6,#d4a017);
  animation:fall linear infinite;will-change:transform}
@keyframes fall{
  from{transform:translate3d(0,-24px,0) rotate(0)}
  to{transform:translate3d(0,var(--fall-h),0) rotate(540deg)}}

.item{
  position:absolute;left:0;top:0;transform-origin:center;cursor:grab;
  touch-action:none;backface-visibility:hidden;
  contain:layout style paint;
}
.item.dragging{z-index:100;cursor:grabbing}
.item img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;
  -webkit-user-drag:none}
.item[data-type="xingdian"] img{animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.75;transform:scale(.88)}50%{opacity:1;transform:scale(1.12)}}

.ghost{position:fixed;left:0;top:0;transform-origin:center;pointer-events:none;
  z-index:9999;opacity:.9;will-change:transform;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.3))}
.ghost img{display:block;width:100%;height:100%;object-fit:contain}

/* ===== 进度环 ===== */
#ring{position:absolute;top:10px;right:10px;width:58px;height:58px;
  display:grid;place-items:center;pointer-events:none;z-index:5}
#ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#ring .bg{fill:none;stroke:rgba(200,16,46,.14);stroke-width:4}
#ring .fg{fill:none;stroke:#c8102e;stroke-width:4;stroke-linecap:round;
  transition:stroke-dashoffset .55s cubic-bezier(.3,1.2,.5,1)}
#ring span{font-size:12px;font-weight:700;color:#c8102e}

/* ===== 音乐开关 ===== */
#btnMusic{position:absolute;top:10px;left:10px;z-index:6;
  width:44px;height:44px;border-radius:50%;border:1px solid rgba(212,160,23,.5);
  background:linear-gradient(#fffdf8,#f6ecd8);cursor:pointer;padding:0;
  display:grid;place-items:center;font-size:18px;line-height:1;
  transition:transform .12s;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;color:#c8102e}
#btnMusic:active{transform:scale(.9)}
#btnMusic.off{opacity:.4}

/* ===== 底部托盘 ===== */
#tray{position:absolute;left:0;right:0;bottom:0;z-index:10;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,rgba(255,252,246,.95) 18%,rgba(255,252,246,.99));
  pointer-events:none}
#tray > *{pointer-events:auto}
.row-label{font-size:11px;letter-spacing:.28em;color:#aa9c90;padding:5px 2px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}

/* 花篮图标：68px */
.chip{flex:0 0 auto;width:68px;height:68px;border-radius:50%;
  display:grid;place-items:center;background:linear-gradient(#fffefa,#f7eeda);
  border:2px solid rgba(212,160,23,.45);box-shadow:0 2px 6px rgba(0,0,0,.1);
  cursor:grab;touch-action:none;transition:transform .12s;overflow:hidden}
.chip:active{transform:scale(.92)}
.chip img{width:88%;height:88%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}

.btn-icon{
  width:64px;height:64px;border-radius:50%;border:none;background:transparent;
  padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease;flex-shrink:0;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  position:relative;
}
.btn-icon:hover{transform:scale(1.05)}
.btn-icon:active,
.btn-icon.pressed{transform:scale(.88)}
.btn-icon img{width:100%;height:100%;object-fit:contain;pointer-events:none;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
#toolbar{display:flex;justify-content:center;gap:14px;padding:6px 0 0}
#toolbar .btn-icon{width:64px;height:64px}

/* ===== 弹窗 ===== */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:rgba(58,51,48,.42);backdrop-filter:blur(5px)}
#modal.hidden{display:none}
.card{width:min(88vw,340px);padding:22px 20px 18px;border-radius:18px;text-align:center;
  background:radial-gradient(circle at 50% 0%,#fffdf7,#f3e8d4);
  box-shadow:0 18px 48px rgba(0,0,0,.28),inset 0 0 0 1px rgba(212,160,23,.5);
  animation:cardIn .38s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardIn{from{transform:scale(.88) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:0 0 6px;font-size:16px;letter-spacing:.24em;color:#c8102e}
.card .complete-icon{width:48px;height:48px;margin:0 auto 10px;display:block;object-fit:contain}
.big-score{font-size:44px;line-height:1.1;color:#a80f24;font-weight:700}
.big-score small{font-size:14px;margin-left:4px;color:#a0928a;font-weight:400}
.bars{margin:14px 0 12px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:11px;color:#7d6f66;margin-bottom:7px}
.bar-row>span{width:56px;text-align:right;flex:none}
.bar{flex:1;height:6px;border-radius:4px;background:rgba(200,16,46,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:4px;
  background:linear-gradient(90deg,#d4a017,#c8102e);transition:width .8s}
#comment{font-size:13px;line-height:1.8;color:#6b5d53;margin:0 0 16px;min-height:2.4em}
.modal-actions{display:flex;justify-content:center;gap:20px;margin-top:10px}
.modal-actions .btn-icon{width:56px;height:56px}
</style>
</head>
<body>

<div id="app">

<!-- ===== 开始界面 ===== -->
<div id="startScreen">
  <h1 class="game-title" id="gameTitle">盛世簪花</h1>
  <p class="start-subtitle" id="startSubtitle">金秋簪花 · 以花为礼</p>
  <button id="btnStart" type="button"><img src="start.png" alt="" onerror="this.parentNode.innerHTML='<span style=&quot;font-size:22px;color:#c8102e;font-weight:bold&quot;>开始游戏</span>'"></button>
</div>

<div id="title">
  <h1 id="topTitle">簪花献礼</h1>
  <p id="topSubtitle">金秋簪花 · 以花为礼</p>
</div>

<!-- ===== 舞台 ===== -->
<div class="stage-wrap">
  <div id="stage">
    <img id="girlImg" src="girl.png" alt="" draggable="false">
    <div id="layer"></div>
    <div id="petals"></div>
    <div id="ring">
      <svg viewBox="0 0 60 60"><circle class="bg" cx="30" cy="30" r="26"/><circle class="fg" cx="30" cy="30" r="26"/></svg>
      <span>0</span>
    </div>
    <button id="btnMusic" type="button" title="音乐开关">♪</button>
  </div>
</div>

<!-- ===== 底部托盘 ===== -->
<div id="tray">
  <div class="row-label" id="lblFlower">花篮</div>
  <div class="row" id="flowers"></div>
  <div class="row-label" id="lblProps">国庆礼器</div>
  <div class="row" id="props"></div>
  <div id="toolbar">
    <button class="btn-icon" id="btnUndo" type="button"><img src="undo.png" alt="撤销" onerror="this.parentNode.innerHTML='撤销'"></button>
    <button class="btn-icon" id="btnClear" type="button"><img src="clear.png" alt="清空" onerror="this.parentNode.innerHTML='清空'"></button>
    <button class="btn-icon" id="btnRandom" type="button"><img src="random.png" alt="随机" onerror="this.parentNode.innerHTML='随机'"></button>
    <button class="btn-icon" id="btnDone" type="button"><img src="submit.png" alt="提交" onerror="this.parentNode.innerHTML='提交'"></button>
  </div>
</div>

</div>

<!-- ===== 结算弹窗 ===== -->
<div id="modal" class="hidden">
  <div class="card">
    <img class="complete-icon" src="complete.png" alt="" onerror="this.style.display='none'">
    <h2 id="doneTitle">献礼完成</h2>
    <div class="big-score"><span id="scoreNum">0</span><small id="scoreUnit">分</small></div>
    <div class="bars">
      <div class="bar-row"><span id="lblBar1">花材丰度</span><div class="bar"><i id="bar1"></i></div></div>
      <div class="bar-row"><span id="lblBar2">红金配比</span><div class="bar"><i id="bar2"></i></div></div>
      <div class="bar-row"><span id="lblBar3">礼器搭配</span><div class="bar"><i id="bar3"></i></div></div>
    </div>
    <p id="comment"></p>
    <div class="modal-actions">
      <button class="btn-icon" id="btnSave" type="button"><img src="save.png" alt="截图" onerror="this.parentNode.innerHTML='截图'"></button>
      <button class="btn-icon" id="btnRedo" type="button"><img src="redo.png" alt="重搭" onerror="this.parentNode.innerHTML='重搭'"></button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   中文用 Unicode 转义防乱码
   ========================================================= */
document.title = '\u76db\u4e16\u7c2a\u82b1';
document.getElementById('gameTitle').textContent = '\u76db\u4e16\u7c2a\u82b1';
document.getElementById('startSubtitle').textContent = '\u91d1\u79cb\u7c2a\u82b1 \u00b7 \u4ee5\u82b1\u4e3a\u793c';
document.getElementById('topTitle').textContent = '\u7c2a\u82b1\u732e\u793c';
document.getElementById('topSubtitle').textContent = '\u91d1\u79cb\u7c2a\u82b1 \u00b7 \u4ee5\u82b1\u4e3a\u793c';
document.getElementById('lblFlower').textContent = '\u82b1\u7bee';
document.getElementById('lblProps').textContent = '\u56fd\u5e86\u793c\u5668';
document.getElementById('doneTitle').textContent = '\u732e\u793c\u5b8c\u6210';
document.getElementById('scoreUnit').textContent = '\u5206';
document.getElementById('lblBar1').textContent = '\u82b1\u6750\u4e30\u5ea6';
document.getElementById('lblBar2').textContent = '\u7ea2\u91d1\u914d\u6bd4';
document.getElementById('lblBar3').textContent = '\u793c\u5668\u642d\u914d';

var $ = function(s){ return document.querySelector(s); };
function clamp(v,a,b){ return Math.min(b, Math.max(a,v)); }
function rand(a,b){ return a + Math.random()*(b-a); }

/* =========================================================
   素材
   ========================================================= */
var TYPES = {
  mudan:  {n:'牡丹',    k:'f', s:52, red:1, adv:1, img:'mudan.png'},
  meihua: {n:'花枝',    k:'f', s:56, red:1, adv:1, img:'meihua.png'},
  juhua:  {n:'菊花',    k:'f', s:48, red:0, adv:1, img:'juhua.png'},
  hehua:  {n:'荷花',    k:'f', s:48, red:0, adv:1, img:'hehua.png'},
  meigui: {n:'玫瑰',    k:'f', s:48, red:1, adv:1, img:'meigui.png'},
  xiangyun:{n:'祥云',   k:'p', s:34, red:0, adv:1, img:'xiangyun.png'},
  xingdian:{n:'金星',   k:'p', s:38, red:1, adv:1, img:'xingdian.png'}
};
var FLOWERS = ['mudan','meihua','juhua','hehua','meigui'];
var PROPS   = ['xiangyun','xingdian'];

(function preload(){
  var urls = ['girl.png'];
  Object.keys(TYPES).forEach(function(k){ urls.push(TYPES[k].img); });
  urls.forEach(function(u){ var img = new Image(); img.src = u; });
})();

/* =========================================================
   音频总线
   ========================================================= */
var AC = null;
function ac(){
  if(!AC){
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    AC = new C();
  }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}

/* 短音效 */
function tone(f, dur, type, vol, delay){
  var c = ac(); if(!c) return;
  try{
    var t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.06);
  }catch(e){}
}
function sPluck(){ tone(420, .16, 'triangle', .05); }
function sPlace(){ tone(660, .5, 'sine', .09); tone(990, .3, 'sine', .03); }
function sUndo(){ tone(330, .22, 'sine', .06); }
function sWin(){ [523.25,659.25,783.99].forEach(function(f,i){ tone(f,.9,'sine',.09,i*.17); }); }

/* =========================================================
   背景音乐：舒缓古风（羽调式 + 古筝 + 低音 + 混响）
   ========================================================= */
var bgmPlaying = false;
var bgmTimer = null;
var bgmMaster = null;
var bgmDelay = null;
var bgmFeedback = null;
var bgmWet = null;
var bgmNotes = [];

function initBus(){
  var c = ac(); if(!c) return null;
  if(bgmMaster) return bgmMaster;

  bgmMaster = c.createGain();
  bgmMaster.gain.value = 0.11;

  bgmDelay = c.createDelay(1.0);
  bgmDelay.delayTime.value = 0.32;
  bgmFeedback = c.createGain();
  bgmFeedback.gain.value = 0.35;
  bgmWet = c.createGain();
  bgmWet.gain.value = 0.4;

  bgmDelay.connect(bgmFeedback);
  bgmFeedback.connect(bgmDelay);
  bgmDelay.connect(bgmWet);
  bgmWet.connect(c.destination);

  bgmMaster.connect(c.destination);
  bgmMaster.connect(bgmDelay);

  return bgmMaster;
}

function playZheng(freq, when, dur, vol){
  var c = ac(); if(!c) return;
  var bus = initBus(); if(!bus) return;
  var t0 = c.currentTime + when;

  var o = c.createOscillator(), g = c.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.025);
  g.gain.exponentialRampToValueAtTime(vol * 0.45, t0 + 0.18);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(bus);
  o.start(t0); o.stop(t0 + dur + 0.05);
  bgmNotes.push(o);

  var o2 = c.createOscillator(), g2 = c.createGain();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(freq * 2, t0);
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.exponentialRampToValueAtTime(vol * 0.18, t0 + 0.025);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * 0.55);
  o2.connect(g2); g2.connect(bus);
  o2.start(t0); o2.stop(t0 + dur * 0.55 + 0.05);
  bgmNotes.push(o2);
}

function playBass(freq, when, dur, vol){
  var c = ac(); if(!c) return;
  var bus = initBus(); if(!bus) return;
  var t0 = c.currentTime + when;

  var o = c.createOscillator(), g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.25);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(bus);
  o.start(t0); o.stop(t0 + dur + 0.1);
  bgmNotes.push(o);
}

function midiToHz(m){ return 440 * Math.pow(2, (m - 69) / 12); }

/* 每拍 0.5 秒 —— 舒缓 */
var BEAT = 0.5;

/* 主旋律：[MIDI 音高, 拍数]，羽调式，婉转悠扬 */
var MELODY = [
  [67,2],[69,2],[72,3],[69,1],
  [67,2],[64,2],[62,2],[64,2],
  [67,2],[69,2],[72,2],[74,2],
  [72,3],[69,1],[67,4],
  [64,2],[67,2],[69,2],[67,2],
  [64,2],[62,2],[60,4],
  [62,2],[64,2],[67,2],[64,2],
  [62,2],[60,6]
];

/* 低音伴奏：[MIDI 音高, 拍数] */
var BASS = [
  [48,8],[55,8],
  [45,8],[52,8],
  [48,8],[43,8],
  [48,16],
  [45,8],[52,8],
  [48,16]
];

/* 古筝琶音点缀：[起始拍, MIDI音高数组] */
var ARPS = [
  {t: 0,  notes:[60,64,67,72]},
  {t: 8,  notes:[67,72,76,79]},
  {t: 16, notes:[57,60,64,69]},
  {t: 24, notes:[60,64,67,72]},
  {t: 32, notes:[67,69,72,76]},
  {t: 40, notes:[64,67,72,76]},
  {t: 48, notes:[60,64,67,72]},
  {t: 56, notes:[67,69,72,76]}
];

function scheduleLoop(){
  if(!bgmPlaying) return;

  /* 主旋律 */
  var t = 0;
  for(var i=0;i<MELODY.length;i++){
    var note = MELODY[i];
    var durBeats = note[1];
    var durSec = durBeats * BEAT * 0.95;
    playZheng(midiToHz(note[0]), t * BEAT, durSec, 0.5);
    t += durBeats;
  }
  var totalBeats = t;

  /* 低音伴奏 */
  var bt = 0;
  for(var j=0;j<BASS.length;j++){
    var b = BASS[j];
    var bDurBeats = b[1];
    playBass(midiToHz(b[0]), bt * BEAT, bDurBeats * BEAT * 0.9, 0.28);
    bt += bDurBeats;
  }

  /* 古筝琶音 */
  for(var k=0;k<ARPS.length;k++){
    var arp = ARPS[k];
    if(arp.t >= totalBeats) break;
    for(var n=0;n<arp.notes.length;n++){
      var dly = arp.t * BEAT + n * 0.09;
      playZheng(midiToHz(arp.notes[n]), dly, 0.9, 0.22);
    }
  }

  var durMs = totalBeats * BEAT * 1000 - 300;
  bgmTimer = setTimeout(function(){
    bgmNotes = [];
    scheduleLoop();
  }, durMs);
}

function startBGM(){
  if(bgmPlaying) return;
  var c = ac(); if(!c) return;
  bgmPlaying = true;
  initBus();
  if(bgmMaster) bgmMaster.gain.value = 0.11;
  scheduleLoop();
  var btn = document.getElementById('btnMusic');
  if(btn) btn.classList.remove('off');
}

function stopBGM(){
  bgmPlaying = false;
  if(bgmTimer){ clearTimeout(bgmTimer); bgmTimer = null; }
  if(bgmMaster) bgmMaster.gain.value = 0;
  var btn = document.getElementById('btnMusic');
  if(btn) btn.classList.add('off');
}

/* =========================================================
   状态：actionHistory 避免与浏览器冲突
   ========================================================= */
var stage = $('#stage'), layer = $('#layer'), petalsBox = $('#petals');
var state = { items: [], progress: 0 };
var uid = 0, drag = null, actionHistory = [];

function snap(){
  return JSON.stringify({
    items: state.items.map(function(i){ return {t:i.type, x:+i.nx.toFixed(4), y:+i.ny.toFixed(4), r:i.rot||0}; }),
    p: state.progress
  });
}
function commit(){
  var s = snap();
  if(actionHistory.length && actionHistory[actionHistory.length-1] === s) return;
  actionHistory.push(s);
  if(actionHistory.length > 60) actionHistory.shift();
}

/* =========================================================
   布局
   ========================================================= */
var RATIO = 1;

function fit(){
  var wrap = document.querySelector('.stage-wrap');
  var vw = wrap.clientWidth, vh = wrap.clientHeight;
  var w = vw, h = w / RATIO;
  if(h > vh){ h = vh; w = h * RATIO; }
  w = Math.floor(w); h = Math.floor(h);
  stage.style.width  = w + 'px';
  stage.style.height = h + 'px';
  petalsBox.style.setProperty('--fall-h', (h + 40) + 'px');
  layout();
}

function updateTransform(it){
  var el = it.el; if(!el) return;
  var w = stage.clientWidth, h = stage.clientHeight, k = w / 400;
  var sz = TYPES[it.type].s * k;
  var x = it.nx * w - sz / 2;
  var y = it.ny * h - sz / 2;
  el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) rotate(' + (it.rot||0) + 'deg)';
}

function layout(){
  var w = stage.clientWidth, k = w / 400;
  state.items.forEach(function(it){
    var el = it.el; if(!el) return;
    var sz = TYPES[it.type].s * k;
    el.style.width = sz + 'px';
    el.style.height = sz + 'px';
    updateTransform(it);
  });
}

/* =========================================================
   物件
   ========================================================= */
function onItemDown(e){
  e.preventDefault(); e.stopPropagation();
  var el = e.currentTarget, it = null, i;
  for(i=0;i<state.items.length;i++){
    if(state.items[i].el === el){ it = state.items[i]; break; }
  }
  if(!it) return;
  var r = stage.getBoundingClientRect();
  drag = {
    mode: 'move', item: it,
    dx: e.clientX - r.left - it.nx * r.width,
    dy: e.clientY - r.top  - it.ny * r.height,
    w: r.width, h: r.height, left: r.left, top: r.top
  };
  el.classList.add('dragging');
}

function makeItemEl(type, it){
  var el = document.createElement('div');
  el.className = 'item'; el.dataset.type = type;
  el.innerHTML = '<img src="' + TYPES[type].img + '" draggable="false" alt="">';
  el.addEventListener('pointerdown', onItemDown);
  el.addEventListener('dblclick', function(e){
    e.preventDefault();
    it.rot = ((it.rot||0) + 15) % 360;
    updateTransform(it); sPluck(); commit();
  });
  return el;
}

function addItem(type, nx, ny, opts){
  opts = opts || {};
  var it = { id: ++uid, type: type, nx: clamp(nx,0,1), ny: clamp(ny,0,1), rot: 0 };
  it.el = makeItemEl(type, it);
  layer.appendChild(it.el);
  state.items.push(it);
  var w = stage.clientWidth, k = w / 400;
  var sz = TYPES[type].s * k;
  it.el.style.width  = sz + 'px';
  it.el.style.height = sz + 'px';
  updateTransform(it);
  if(it.el.animate) it.el.animate([{opacity:0},{opacity:1}], {duration:180, easing:'ease-out'});
  if(!opts.silent) sPlace();
  if(TYPES[type].adv) advance();
  if(!opts.noCommit) commit();
}

/* =========================================================
   清空：加强版
   ========================================================= */
function clearAll(){
  if(drag){
    if(drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
    if(drag.item && drag.item.el) drag.item.el.classList.remove('dragging');
    drag = null;
  }
  var ghosts = document.querySelectorAll('.ghost');
  for(var g=0;g<ghosts.length;g++){
    if(ghosts[g].parentNode) ghosts[g].parentNode.removeChild(ghosts[g]);
  }
  state.items = [];
  state.progress = 0;
  while(layer.firstChild){ layer.removeChild(layer.firstChild); }
  layer.innerHTML = '';
  void layer.offsetHeight;
  updateRing();
  commit();
}

function restore(str){
  var d = JSON.parse(str), i, o, it;
  layer.innerHTML = '';
  state.items = [];
  state.progress = d.p || 0;
  for(i=0;i<d.items.length;i++){
    o = d.items[i];
    it = { id: ++uid, type: o.t, nx: o.x, ny: o.y, rot: o.r || 0 };
    it.el = makeItemEl(o.t, it);
    layer.appendChild(it.el);
    state.items.push(it);
  }
  layout(); updateRing();
}

function undo(){
  if(actionHistory.length <= 1) return;
  actionHistory.pop();
  restore(actionHistory[actionHistory.length-1]);
  sUndo();
}

function randomize(){
  clearAll();
  var n = 6 + Math.floor(Math.random()*5), i;
  for(i=0;i<n;i++){
    var t = FLOWERS[Math.floor(Math.random()*FLOWERS.length)];
    var a = rand(0, Math.PI*2), rad = rand(0, .2);
    addItem(t, clamp(.5 + Math.cos(a)*rad, .2, .8), clamp(.25 + Math.sin(a)*rad*.8, .08, .42),
      {silent:true, noCommit:true});
  }
  addItem(PROPS[Math.floor(Math.random()*PROPS.length)], rand(.25,.75), rand(.2,.38), {silent:true, noCommit:true});
  sPlace(); commit();
}

/* =========================================================
   进度环：无上限
   ========================================================= */
var RING_C = 2 * Math.PI * 26;
function updateRing(){
  var fg = document.querySelector('#ring .fg');
  if(!fg) return;
  var shown = state.progress % 5;
  if(state.progress > 0 && shown === 0) shown = 5;
  fg.style.strokeDasharray  = RING_C;
  fg.style.strokeDashoffset = RING_C * (1 - shown / 5);
  document.querySelector('#ring span').textContent = state.progress;
}

function advance(){
  state.progress++;
  updateRing();
  if(state.progress % 5 === 0) sWin();
}

/* =========================================================
   飘落花瓣
   ========================================================= */
function initPetals(){
  var n = window.innerWidth < 520 ? 14 : 22, i;
  for(i=0;i<n;i++){
    var p = document.createElement('div'); p.className = 'petal';
    var sz = rand(5,10);
    p.style.width = sz + 'px';
    p.style.height = (sz * .7) + 'px';
    p.style.left = rand(0,100) + '%';
    p.style.animationDuration = rand(8,16) + 's';
    p.style.animationDelay = (-rand(0,16)) + 's';
    p.style.opacity = rand(.35,.85);
    petalsBox.appendChild(p);
  }
}

/* =========================================================
   花篮
   ========================================================= */
function makeChip(type){
  var d = document.createElement('div');
  d.className = 'chip';
  d.innerHTML = '<img src="' + TYPES[type].img + '" draggable="false" alt="">';
  d.title = TYPES[type].n;

  var sx = 0, sy = 0, moved = false, pressing = false;

  d.addEventListener('pointerdown', function(e){
    e.preventDefault(); e.stopPropagation();
    pressing = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    if(d.setPointerCapture){ try{ d.setPointerCapture(e.pointerId); }catch(err){} }
  });
  d.addEventListener('pointermove', function(e){
    if(!pressing) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if(!moved && Math.sqrt(dx*dx + dy*dy) > 6){
      moved = true;
      var g = document.createElement('div');
      g.className = 'ghost';
      g.innerHTML = '<img src="' + TYPES[type].img + '" draggable="false">';
      var sz = Math.max(48, TYPES[type].s * (stage.clientWidth / 400));
      g.style.width = sz + 'px'; g.style.height = sz + 'px';
      g.style.transform = 'translate3d(' + (e.clientX - sz/2) + 'px,' + (e.clientY - sz/2) + 'px,0)';
      document.body.appendChild(g);
      drag = { mode: 'new', type: type, ghost: g, sz: sz };
      sPluck();
    }
    if(moved && drag && drag.ghost){
      drag.ghost.style.transform = 'translate3d(' + (e.clientX - drag.sz/2) + 'px,' + (e.clientY - drag.sz/2) + 'px,0)';
    }
  });
  d.addEventListener('pointerup', function(e){
    if(!pressing) return;
    pressing = false;
    if(moved && drag && drag.mode === 'new'){
      var r = stage.getBoundingClientRect();
      var inside = e.clientX >= r.left && e.clientX <= r.right &&
                   e.clientY >= r.top  && e.clientY <= r.bottom;
      if(inside) addItem(drag.type, (e.clientX - r.left)/r.width, (e.clientY - r.top)/r.height);
      if(drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
      drag = null;
    }
  });
  d.addEventListener('pointercancel', function(){
    pressing = false;
    if(drag && drag.mode === 'new' && drag.ghost && drag.ghost.parentNode){
      drag.ghost.parentNode.removeChild(drag.ghost);
      drag = null;
    }
  });
  return d;
}
function buildTray(){
  FLOWERS.forEach(function(t){ $('#flowers').appendChild(makeChip(t)); });
  PROPS.forEach(function(t){ $('#props').appendChild(makeChip(t)); });
}

/* =========================================================
   指针拖动 rAF 节流
   ========================================================= */
var rafId = 0, pending = null;

window.addEventListener('pointermove', function(e){
  if(!drag || drag.mode !== 'move') return;
  pending = { x: e.clientX, y: e.clientY };
  if(!rafId){
    rafId = requestAnimationFrame(function(){
      rafId = 0;
      if(!pending || !drag || drag.mode !== 'move') return;
      var it = drag.item;
      it.nx = clamp((pending.x - drag.left - drag.dx) / drag.w, 0, 1);
      it.ny = clamp((pending.y - drag.top  - drag.dy) / drag.h, 0, 1);
      updateTransform(it);
      pending = null;
    });
  }
}, {passive: true});

window.addEventListener('pointerup', function(){
  if(!drag) return;
  if(drag.mode === 'move'){
    if(drag.item.el) drag.item.el.classList.remove('dragging');
    commit();
    drag = null;
  }
});
window.addEventListener('blur', function(){
  if(drag && drag.mode === 'move' && drag.item.el){
    drag.item.el.classList.remove('dragging');
    commit();
    drag = null;
  }
});
window.addEventListener('pointercancel', function(){
  if(drag && drag.mode === 'move' && drag.item.el) drag.item.el.classList.remove('dragging');
  if(drag && drag.mode === 'new' && drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
  drag = null;
});

/* =========================================================
   评分
   ========================================================= */
var COMMENTS = {
  high: ['金桂盈髻，赤心献礼，此冠可贺华诞。','繁花满头，红金相映，盛世簪花之姿。','花团锦簇，礼器生辉，可称国色天香。'],
  mid:  ['簪花有序，红金得宜，再添一枝更妙。','颇有章法，惜花色尚欠丰盈。','花意已具，礼器略单，稍加点缀即成佳制。'],
  low:  ['花枝零落，尚需用心，方能成礼。','红金未谐，宜增花色、添礼器。','初具雏形，再簪数枝，可成大观。']
};
function evaluate(){
  var items = state.items;
  if(items.length === 0) return { score:0, bars:[0,0,0], comment:'尚未簪花，何以为礼？先为佳人添一枝吧。' };
  var fs = {}, ps = {}, reds = 0;
  items.forEach(function(it){
    if(TYPES[it.type].k === 'f') fs[it.type] = 1; else ps[it.type] = 1;
    if(TYPES[it.type].red) reds++;
  });
  var fk = Object.keys(fs).length, pk = Object.keys(ps).length;
  var richness = clamp(fk / 5, 0, 1);
  var ratio = reds / items.length, rb;
  if(ratio < .3) rb = ratio / .3 * .7;
  else if(ratio <= .6) rb = 1;
  else rb = clamp(1 - (ratio - .6) / .4, 0, 1);
  rb *= clamp(items.length / 6, .4, 1);
  var propScore = clamp(pk / 2, 0, 1);
  var total = Math.round((richness * .34 + rb * .33 + propScore * .33) * 100);
  var pool = total >= 78 ? COMMENTS.high : (total >= 50 ? COMMENTS.mid : COMMENTS.low);
  return { score: total, bars: [richness, rb, propScore], comment: pool[Math.floor(Math.random()*pool.length)] };
}

/* =========================================================
   按钮绑定
   ========================================================= */
var modal = $('#modal');

function bindFast(el, fn){
  if(!el) return;
  var lastFire = 0;
  function fire(e){
    var now = Date.now();
    if(now - lastFire < 200) return;
    lastFire = now;
    try{ fn(e); }catch(err){ console.error(err); }
  }
  el.addEventListener('pointerdown', function(e){
    e.preventDefault();
    e.stopPropagation();
    el.classList.add('pressed');
    fire(e);
  });
  el.addEventListener('click', function(e){
    e.preventDefault();
    fire(e);
  });
  el.addEventListener('pointerup', function(){ el.classList.remove('pressed'); });
  el.addEventListener('pointerleave', function(){ el.classList.remove('pressed'); });
  el.addEventListener('pointercancel', function(){ el.classList.remove('pressed'); });
  el.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fire(e); }
  });
}

bindFast($('#btnStart'), function(){
  $('#startScreen').classList.add('hidden');
  sPluck();
  startBGM();
  setTimeout(function(){ $('#startScreen').style.display = 'none'; }, 500);
});

bindFast($('#btnUndo'), undo);
bindFast($('#btnClear'), function(){ clearAll(); sUndo(); });
bindFast($('#btnRandom'), randomize);

bindFast($('#btnDone'), function(){
  var r = evaluate();
  $('#scoreNum').textContent = r.score;
  $('#comment').textContent  = r.comment;
  var bars = [$('#bar1'), $('#bar2'), $('#bar3')];
  bars.forEach(function(b){ b.style.width = '0%'; });
  modal.classList.remove('hidden');
  setTimeout(function(){
    bars.forEach(function(b,i){ b.style.width = Math.round(r.bars[i]*100) + '%'; });
  }, 60);
  if(r.score >= 78) sWin();
});

bindFast($('#btnSave'), function(){
  alert('\u8bf7\u4f7f\u7528\u7cfb\u7edf\u622a\u56fe\u4fdd\u5b58\uff08Windows: Win+Shift+S\uff0cMac: Cmd+Shift+4\uff09');
});

bindFast($('#btnRedo'), function(){
  modal.classList.add('hidden');
  clearAll(); sPluck();
});

bindFast($('#btnMusic'), function(){
  if(bgmPlaying){ stopBGM(); }
  else { startBGM(); }
});

/* =========================================================
   启动
   ========================================================= */
try{
  buildTray();
  initPetals();
  updateRing();
  fit();
  actionHistory.push(snap());
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 180); });
}catch(e){
  alert('\u542f\u52a8\u51fa\u9519\uff1a' + e.message);
}
</script>
